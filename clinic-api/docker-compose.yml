version: '3.8'

services:
  redis-cache:
    image: redis:latest
    container_name: redis-cache
    networks:
      - clinic-network

  patient-db:
    image: postgres:15-alpine
    container_name: patient-db
    environment:
      POSTGRES_DB: clinic_patient_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2012Mykola2012
    networks:
      - clinic-network

  appointment-db:
    image: postgres:15-alpine
    container_name: appointment-db
    environment:
      POSTGRES_DB: clinic_appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2012Mykola2012
    networks:
      - clinic-network

  patient-service:
    build: ./patient-service
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-db:5432/clinic_patient_db
      - SPRING_DATA_REDIS_HOST=redis-cache
    depends_on:
      - patient-db
      - redis-cache
    networks:
      - clinic-network

  appointment-service:
    build: ./appointment-service
    container_name: appointment-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://appointment-db:5432/clinic_appointment_db
    depends_on:
      - appointment-db
    networks:
      - clinic-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - patient-service
      - appointment-service
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge